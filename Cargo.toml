[package]
authors = ["Johan Helsing <johanhelsing@gmail.com>"]
categories = ["game-development", "rendering", "graphics"]
description = "2d sdf shape renderer plugin for Bevy"
edition = "2024"
keywords = ["gamedev", "bevy", "sdf"]
license = "MIT OR Apache-2.0"
name = "bevy_smud"
repository = "https://github.com/johanhelsing/bevy_smud"
version = "0.15.0"

[features]
default = ["bevy_picking", "bevy_primitives", "bevy_ui"]
bevy_picking = ["bevy/bevy_picking"]
bevy_ui = ["bevy/bevy_ui_render"]
bevy_primitives = []
# CPU SDFs call the `libm` crate instead of the platform's math library (through
# Bevy's own `libm` feature), so they return the same bits on every platform,
# for deterministic simulation.
libm = ["bevy/libm"]
# For WebGL2, which has no storage buffers: on wasm32, render shapes with
# smud's own instanced pipeline instead of Bevy's Mesh2d. Turns on Bevy's
# `webgl2`. Native builds keep Mesh2d.
webgl2 = ["bevy/webgl2"]
# Internal: use the WebGL2 renderer on native too, to compare the two.
native_webgl2_renderer = []

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
  "bevy_asset",         # needed for handle ids
  "bevy_core_pipeline",
  "bevy_log",
  "bevy_render",
  "bevy_sprite_render", # shapes are Mesh2d
  "multi_threaded",
] }
bytemuck = { version = "1.15.0", features = ["derive"] }
copyless = "0.1"
bitflags = "2.5"
fixedbitset = "0.5"
uuid = "1.10.0"

[dev-dependencies]
bevy = { version = "0.20", default-features = false, features = [
  "bevy_post_process",
  "bevy_sprite_render",
  "bevy_state",
  "bevy_ui_widgets",
  "png",
  "bevy_winit",
  "default_font",
  "x11",            # github actions runners don't have libxkbcommon installed, so can't use wayland
] }
bevy_asset_loader = "0.28"
bevy_lospec = "0.14"
bevy_pancam = "0.22"
rand = "0.10"

# Hot reloading in the examples; there's no file watcher in the browser.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bevy = { version = "0.20", default-features = false, features = ["file_watcher"] }

# rand needs a source of randomness in the browser.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
